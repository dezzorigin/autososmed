services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autososmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autososmed}
      POSTGRES_DB: ${POSTGRES_DB:-autososmed}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-autososmed}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # web + worker menyusul setelah Dockerfile ada (fase build).
  # web:
  #   build: ./web
  #   ports: ["3000:3000"]
  #   depends_on: [db, redis]
  # worker:
  #   build: ./worker
  #   depends_on: [db, redis]

volumes:
  pgdata:
  redisdata:
